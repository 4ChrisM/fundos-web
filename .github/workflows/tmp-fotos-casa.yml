# Temporal: baja candidatas de fotos de Wikimedia Commons (la red de la sesión no llega a Commons). Se borra después.
name: Temporal fotos casa
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/tmp/buscar_casas.py", "tools/tmp/elegidas.json"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f tools/tmp/elegidas.json ]; then python3 tools/tmp/bajar_elegidas.py; else python3 tools/tmp/buscar_casas.py; fi
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add tools/tmp; git commit -m "Candidatas de Commons" || exit 0; git push
