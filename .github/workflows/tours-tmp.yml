# Temporal: baja archivos de los recorridos 360° (la red de la sesión en la nube no llega a ellos).
name: tours-tmp
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/tmp-tours/urls.txt"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd tools/tmp-tours && mkdir -p out
          while read -r name url; do
            [ -z "$name" ] && continue
            mkdir -p "out/$(dirname "$name")"
            curl -sSL --max-time 120 -o "out/$name" "$url" -w "$name %{http_code} %{size_download}\n" || echo "$name FALLO"
          done < urls.txt | tee out/log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/tmp-tours/out
          git commit -m "Archivos de los recorridos" || exit 0
          git push
