# Temporal: calcula con OSRM las rutas que faltan del mapa del entorno de Malalcahuello (la red de la sesión de
# Claude no alcanza router.project-osrm.org) y deja el resultado en la rama. Se borra después de usarlo.
name: Rutas del entorno (temporal)
on:
  push:
    branches: [claude/amazing-fermi-knnnar]
    paths: [.github/workflows/entorno-rutas-temporal.yml]
permissions:
  contents: write
jobs:
  rutas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 tools/entorno_build.py --proyecto malalcahuello --rutas
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/entorno/malalcahuello/rutas-cache.json lib/entorno-malalcahuello.js
          git commit -m "Rutas del entorno de Malalcahuello (OSRM, desde GitHub Actions)" || echo "sin cambios"
          git push
